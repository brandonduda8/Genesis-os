[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-os"
version = "0.1.0"
description = "Genesis AI Operating System"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Brandon Duda"}
]

[project.scripts]
genesis = "genesis.main:main"

[tool.setuptools]
packages = ["genesis"]
